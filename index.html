  <style>
  
  
    
:root {
  --primary: #2f7d32;
  --primary-dark: #205c25;
  --primary-light: #e7f5e7;

  --text: #172318;
  --text-light: #637064;

  --background: #ffffff;
  --surface: #f6faf5;
  --border: #e2ebe0;

  --header-bg: rgba(255, 255, 255, 0.95);
  --shadow: 0 12px 35px rgba(38, 91, 42, 0.1);
}

[data-theme="dark"] {
  --primary: #80d884;
  --primary-dark: #a5eca9;
  --primary-light: #203b24;

  --text: #edf8ed;
  --text-light: #b7c7b8;

  --background: #101710;
  --surface: #172218;
  --border: #2d4030;

  --header-bg: rgba(16, 23, 16, 0.96);
  --shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
}

/* Basic Reset */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 80px;
}

body {
  min-width: 320px;
  overflow-x: hidden;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: var(--background);
  line-height: 1.6;
  transition:
    background 0.3s ease,
    color 0.3s ease;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

/* Main Container */

.container {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding-left: 18px;
  padding-right: 18px;
}

.section {
  padding: 58px 0;
}

.eyebrow {
  display: inline-block;
  margin-bottom: 12px;
  color: var(--primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.section-heading {
  max-width: 650px;
  margin: 0 auto 32px;
  text-align: center;
}

.section-heading h2 {
  margin-bottom: 12px;
  font-size: clamp(1.9rem, 6vw, 3rem);
  line-height: 1.2;
}

.section-heading p {
  color: var(--text-light);
  font-size: 0.95rem;
}

/* Header - Mobile First */

.site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}

.nav-container {
  min-height: 68px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  margin-right: auto;
}

.logo-icon {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--primary-light);
  font-size: 1.35rem;
}

.logo strong {
  display: block;
  color: var(--primary);
  font-size: 1.05rem;
  line-height: 1.1;
}

.logo small {
  display: block;
  margin-top: 3px;
  color: var(--text-light);
  font-size: 0.57rem;
  line-height: 1.2;
}

.hamburger {
  display: block;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  order: 2;
}

.hamburger span {
  display: block;
  width: 100%;
  height: 3px;
  margin: 4px 0;
  border-radius: 5px;
  background: var(--text);
  transition: 0.3s ease;
}

.hamburger.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

.main-nav {
  position: absolute;
  top: 68px;
  left: 0;
  right: 0;
  display: none;
  flex-direction: column;
  padding: 10px 18px;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.main-nav.open {
  display: flex;
}

.main-nav a {
  padding: 13px 0;
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 700;
  border-bottom: 1px solid var(--border);
}

.main-nav a:last-child {
  border-bottom: none;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  order: 3;
}

.icon-button {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-size: 0.95rem;
  transition: 0.2s ease;
}

.icon-button:hover {
  background: var(--primary-light);
  color: var(--primary);
}

.whatsapp-button {
  color: #20a64a;
}

/* Buttons */

.btn {
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border: 1px solid transparent;
  border-radius: 11px;
  font-size: 0.9rem;
  font-weight: 800;
  text-align: center;
  cursor: pointer;
  transition: 0.25s ease;
}

.btn-primary {
  background: var(--primary);
  color: #ffffff;
}

.btn-primary:hover {
  background: var(--primary-dark);
  color: #ffffff;
  transform: translateY(-2px);
}

.btn-whatsapp {
  background: #20a64a;
  color: #ffffff;
}

.btn-whatsapp:hover {
  background: #168238;
  transform: translateY(-2px);
}

/* Hero - Mobile First */

.hero-section {
  padding: 55px 0 35px;
  overflow: hidden;
  background:
    radial-gradient(
      circle at top right,
      var(--primary-light),
      transparent 55%
    );
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  align-items: center;
}

.hero-content {
  text-align: center;
}

.hero-content h1 {
  margin-bottom: 20px;
  font-size: clamp(2.45rem, 12vw, 5rem);
  line-height: 1.05;
  letter-spacing: -1.5px;
}

.hero-content h1 span {
  display: block;
  color: var(--primary);
}

.hero-content p {
  max-width: 570px;
  margin: 0 auto 25px;
  color: var(--text-light);
  font-size: 0.98rem;
}

.hero-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hero-buttons .btn {
  width: 100%;
}

.hero-features {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 23px;
  color: var(--text-light);
  font-size: 0.82rem;
}

.hero-visual {
  position: relative;
  min-height: 310px;
  display: grid;
  place-items: center;
}

.hero-circle {
  position: absolute;
  width: min(285px, 85vw);
  aspect-ratio: 1;
  border: 2px dashed var(--primary);
  border-radius: 50%;
  background: var(--primary-light);
}

.hero-main-plant {
  position: relative;
  z-index: 2;
  width: 175px;
  height: 225px;
  display: grid;
  place-items: center;
  border-radius: 48% 48% 18% 18%;
  background: linear-gradient(145deg, #8bd48c, #2f7d32);
  box-shadow: var(--shadow);
  font-size: 5.8rem;
  transform: rotate(-4deg);
}

.plant-card {
  position: absolute;
  z-index: 3;
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--background);
  box-shadow: var(--shadow);
  font-size: 2rem;
}

.plant-card-one {
  top: 20px;
  left: 5%;
  transform: rotate(-10deg);
}

.plant-card-two {
  right: 5%;
  bottom: 55px;
  transform: rotate(10deg);
}

.floating-card {
  position: absolute;
  z-index: 4;
  bottom: 0;
  left: 50%;
  width: min(215px, 80%);
  padding: 12px 15px;
  transform: translateX(-50%);
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--background);
  box-shadow: var(--shadow);
  text-align: center;
}

.floating-card strong,
.floating-card span {
  display: block;
}

.floating-card strong {
  color: var(--primary);
  font-size: 0.95rem;
}

.floating-card span {
  color: var(--text-light);
  font-size: 0.75rem;
}

/* Services */

.services-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.service-card {
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  transition: 0.25s ease;
}

.service-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow);
  transform: translateY(-4px);
}

.service-icon {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  border-radius: 16px;
  background: var(--primary-light);
  font-size: 1.8rem;
}

.service-card h3 {
  margin-bottom: 9px;
  font-size: 1.15rem;
}

.service-card p {
  margin-bottom: 16px;
  color: var(--text-light);
  font-size: 0.92rem;
}

.service-card a {
  color: var(--primary);
  font-size: 0.9rem;
  font-weight: 800;
}

/* About */

.about-section {
  background: var(--surface);
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 35px;
  align-items: center;
}

.about-visual {
  position: relative;
  min-height: 280px;
}

.about-image {
  min-height: 280px;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: linear-gradient(145deg, #b9e7b8, #397e3c);
  box-shadow: var(--shadow);
  font-size: 7rem;
}

.about-badge {
  position: absolute;
  right: 10px;
  bottom: -15px;
  min-width: 125px;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--background);
  box-shadow: var(--shadow);
  text-align: center;
}

.about-badge strong,
.about-badge span {
  display: block;
}

.about-badge strong {
  color: var(--primary);
  font-size: 1.8rem;
}

.about-badge span {
  color: var(--text-light);
  font-size: 0.8rem;
}

.about-content h2 {
  margin-bottom: 17px;
  font-size: clamp(1.9rem, 7vw, 3rem);
  line-height: 1.2;
}

.about-content p {
  margin-bottom: 13px;
  color: var(--text-light);
  font-size: 0.95rem;
}

.about-list {
  display: grid;
  gap: 8px;
  margin: 22px 0 27px;
  list-style: none;
  font-size: 0.92rem;
}

/* Gallery */

.gallery-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
}

.gallery-card {
  position: relative;
  isolation: isolate;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 23px;
  overflow: hidden;
  border-radius: 20px;
  color: #ffffff;
}

.gallery-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.68),
    rgba(0, 0, 0, 0.05)
  );
}

.gallery-card span {
  margin-bottom: auto;
  font-size: 3.5rem;
}

.gallery-card h3 {
  font-size: 1.1rem;
}

.gallery-one {
  background: linear-gradient(145deg, #5a9d57, #214d28);
}

.gallery-two {
  background: linear-gradient(145deg, #b6d88e, #648c3b);
}

.gallery-three {
  background: linear-gradient(145deg, #72bda1, #24664e);
}

.gallery-four {
  background: linear-gradient(145deg, #e6b66e, #a35a35);
}

/* Contact */

.contact-section {
  background: var(--surface);
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
}

.contact-info h2 {
  margin-bottom: 17px;
  font-size: clamp(1.9rem, 7vw, 3rem);
  line-height: 1.2;
}

.contact-info > p {
  margin-bottom: 25px;
  color: var(--text-light);
  font-size: 0.95rem;
}

.contact-details {
  display: grid;
  gap: 12px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--background);
  transition: 0.2s ease;
}

.contact-item:hover {
  border-color: var(--primary);
  transform: translateX(3px);
}

.contact-item-icon {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--primary-light);
  color: var(--primary);
  font-size: 1.2rem;
}

.contact-item strong,
.contact-item small {
  display: block;
}

.contact-item strong {
  font-size: 0.92rem;
}

.contact-item small {
  color: var(--text-light);
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}

.contact-form {
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--background);
  box-shadow: var(--shadow);
}

.contact-form h3 {
  margin-bottom: 22px;
  font-size: 1.4rem;
}

.contact-form label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.85rem;
  font-weight: 800;
}

.contact-form input,
.contact-form select,
.contact-form textarea {
  width: 100%;
  min-width: 0;
  padding: 12px 13px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
  background: var(--surface);
  color: var(--text);
  font-size: 0.9rem;
}

.contact-form input:focus,
.contact-form select:focus,
.contact-form textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.contact-form textarea {
  min-height: 120px;
  resize: vertical;
}

.submit-button {
  width: 100%;
}

.form-note,
.form-message {
  text-align: center;
  font-size: 0.78rem;
}

.form-note {
  margin-top: 10px;
  color: var(--text-light);
}

.form-message {
  margin-top: 10px;
  color: var(--primary);
}

/* Footer */

.site-footer {
  padding-top: 45px;
  background: #102014;
  color: #ffffff;
}

.footer-content {
  display: grid;
  grid-template-columns: 1fr;
  gap: 30px;
  padding-bottom: 35px;
}

.footer-brand p {
  max-width: 320px;
  margin-top: 15px;
  color: #b7c8b8;
  font-size: 0.9rem;
}

.footer-logo strong {
  color: #8be08f;
}

.footer-logo small {
  color: #b7c8b8;
}

.footer-links {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.footer-links h3 {
  margin-bottom: 5px;
  font-size: 1rem;
}

.footer-links a {
  color: #b7c8b8;
  font-size: 0.88rem;
}

.footer-links a:hover {
  color: #8be08f;
}

.footer-bottom {
  padding: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  color: #b7c8b8;
  font-size: 0.75rem;
  text-align: center;
}

/* Small Mobile Devices */

@media (max-width: 360px) {
  .container {
    padding-left: 14px;
    padding-right: 14px;
  }

  .logo strong {
    font-size: 0.95rem;
  }

  .logo small {
    font-size: 0.5rem;
  }

  .header-actions {
    gap: 3px;
  }

  .icon-button {
    width: 31px;
    height: 31px;
    font-size: 0.85rem;
  }

  .hamburger {
    width: 35px;
    height: 35px;
  }

  .hero-content h1 {
    font-size: 2.35rem;
  }

  .hero-main-plant {
    width: 155px;
    height: 205px;
    font-size: 5rem;
  }

  .plant-card-one {
    left: 0;
  }

  .plant-card-two {
    right: 0;
  }
}

/* Tablet */

@media (min-width: 600px) {
  .container {
    padding-left: 28px;
    padding-right: 28px;
  }

  .section {
    padding: 75px 0;
  }

  .hero-buttons {
    flex-direction: row;
    justify-content: center;
  }

  .hero-buttons .btn {
    width: auto;
  }

  .hero-features {
    flex-direction: row;
    justify-content: center;
    flex-wrap: wrap;
  }

  .services-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .footer-content {
    grid-template-columns: 1.5fr 1fr 1fr;
  }
}

/* Laptop and Desktop */

@media (min-width: 900px) {
  .container {
    padding-left: 30px;
    padding-right: 30px;
  }

  .section {
    padding: 95px 0;
  }

  .nav-container {
    min-height: 80px;
  }

  .hamburger {
    display: none;
  }

  .main-nav {
    position: static;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 25px;
    padding: 0;
    border: none;
    box-shadow: none;
    background: transparent;
  }

  .main-nav a {
    padding: 0;
    border: none;
    color: var(--text-light);
    font-size: 0.92rem;
  }

  .main-nav a:hover {
    color: var(--primary);
  }

  .header-actions {
    gap: 8px;
  }

  .icon-button {
    width: 40px;
    height: 40px;
    font-size: 1.1rem;
  }

  .hero-section {
    padding: 105px 0 90px;
  }

  .hero-grid {
    grid-template-columns: 1.05fr 0.95fr;
    gap: 65px;
  }

  .hero-content {
    text-align: left;
  }

  .hero-content h1 {
    font-size: clamp(3.5rem, 5vw, 5rem);
  }

  .hero-content p {
    margin-left: 0;
    margin-right: 0;
    font-size: 1.05rem;
  }

  .hero-buttons {
    justify-content: flex-start;
  }

  .hero-features {
    justify-content: flex-start;
  }

  .hero-visual {
    min-height: 450px;
  }

  .hero-circle {
    width: 390px;
  }

  .hero-main-plant {
    width: 245px;
    height: 300px;
    font-size: 8rem;
  }

  .plant-card {
    width: 92px;
    height: 92px;
    font-size: 2.5rem;
  }

  .plant-card-one {
    top: 45px;
    left: 0;
  }

  .plant-card-two {
    right: 0;
    bottom: 65px;
  }

  .floating-card {
    width: 220px;
    padding: 16px 20px;
  }

  .services-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }

  .service-card {
    padding: 30px;
  }

  .about-grid {
    grid-template-columns: 0.9fr 1.1fr;
    gap: 70px;
  }

  .about-visual {
    min-height: 390px;
  }

  .about-image {
    min-height: 390px;
    font-size: 10rem;
  }

  .about-badge {
    right: -20px;
    bottom: 25px;
  }

  .gallery-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  .gallery-card {
    min-height: 260px;
  }

  .contact-grid {
    grid-template-columns: 0.9fr 1.1fr;
    gap: 65px;
  }

  .contact-form {
    padding: 32px;
  }
}

/* Large Screens */

@media (min-width: 1200px) {
  .hero-content h1 {
    font-size: 5rem;
  }
}
/* =================================
   FINAL MOBILE MENU FIX
================================= */

.site-header {
  position: sticky;
  top: 0;
  z-index: 9999;
}

.nav-container {
  position: relative;
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Three-line button */

.hamburger {
  display: flex !important;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  width: 40px;
  height: 40px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  z-index: 10001;
}

.hamburger span {
  display: block;
  width: 23px;
  height: 3px;
  margin: 0;
  border-radius: 5px;
  background: var(--text);
  transition: 0.3s ease;
}

.hamburger.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* Mobile navigation */

.main-nav {
  position: absolute;
  top: 70px;
  left: 0;
  right: 0;

  display: none;
  flex-direction: column;

  width: 100%;
  padding: 12px 20px;

  background: var(--background);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);

  z-index: 10000;
}

.main-nav.open {
  display: flex !important;
}

.main-nav a {
  display: block;
  width: 100%;
  padding: 14px 0;

  color: var(--text);
  font-size: 16px;
  font-weight: 700;

  border-bottom: 1px solid var(--border);
}

.main-nav a:last-child {
  border-bottom: none;
}

/* Mobile header arrangement */

.logo {
  margin-right: auto;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Laptop and desktop navigation */

@media (min-width: 900px) {
  .hamburger {
    display: none !important;
  }

  .main-nav {
    position: static;
    display: flex !important;
    flex-direction: row;
    width: auto;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
  }

  .main-nav a {
    width: auto;
    padding: 0;
    border: none;
    font-size: 15px;
    color: var(--text-light);
  }
}
